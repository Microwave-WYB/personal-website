# The repository is a mise monorepo. `cv/` is an independent config root
# with its own tools and tasks, available as `//cv:<task>`.
monorepo_root = true

[monorepo]
config_roots = ["cv"]
lockfile = true

[tools]
zola = "0.23.3"

[tasks.cv]
description = "Copy the CV workspace artifact into the website assets"
depends = ["//cv:build"]
run = "cp cv/build/yibo-wei-cv.pdf static/yibo-wei-cv.pdf"
sources = ["cv/build/yibo-wei-cv.pdf"]
outputs = ["static/yibo-wei-cv.pdf"]

[tasks.site]
description = "Build the complete production website"
depends = ["cv"]
run = "zola build"
sources = ["config.toml", "content/**/*", "static/**/*", "templates/**/*"]
outputs = ["public"]

[tasks.serve]
description = "Build the CV and run Zola's local development server"
depends = ["cv"]
run = "zola serve"

[tasks.clean]
description = "Remove generated website and copied CV files"
run = "rm -rf public static/yibo-wei-cv.pdf"
