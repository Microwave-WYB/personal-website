<!doctype html>
<html lang="{{ config.default_language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <link rel="stylesheet" href="{{ get_url(path='site.css', trailing_slash=false) }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="wordmark" href="{{ get_url(path='about/', trailing_slash=true) }}">Yibo Wei</a>
        <nav aria-label="Main navigation">
          <a href="{{ get_url(path='about/', trailing_slash=true) }}">About</a>
          <a href="{{ get_url(path='blog/', trailing_slash=true) }}">Blog</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <span>© {{ now() | date(format='%Y') }} Yibo Wei</span>
        <div class="footer-links">
          <img class="email-image" src="{{ get_url(path='email.png', trailing_slash=false) }}" alt="Email Yibo Wei">
          <a href="{{ config.extra.github }}">GitHub</a>
          <a href="{{ config.extra.linkedin }}">LinkedIn</a>
        </div>
      </div>
    </footer>
  </body>
</html>
