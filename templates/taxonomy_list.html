{% extends "base.html" %}
{% block title %}Tags | {{ config.title }}{% endblock title %}
{% block content %}
  <section class="page">
    <h1>Tags</h1>
    <ul class="tag-index">
      {% for term in terms %}
        <li><a href="{{ term.permalink | safe }}">{{ term.name }}</a> <span>{{ term.pages | length }}</span></li>
      {% endfor %}
    </ul>
  </section>
{% endblock content %}
